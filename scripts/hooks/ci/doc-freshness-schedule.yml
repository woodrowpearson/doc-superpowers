# doc-superpowers workflow v1
# Weekly documentation drift detector
# Installed by doc-superpowers hooks installer
#
# Checks the whole index and keeps one tracking issue: opened or updated
# while docs are stale or missing, closed once a check finds none. A check
# that cannot run fails the run and leaves the issue as it is.

name: Doc Freshness Audit (Scheduled)

on:
  schedule:
    - cron: '__CRON_SCHEDULE__'
  workflow_dispatch: # Allow manual trigger

jobs:
  audit-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      # The result stays in $RUNNER_TEMP; only scalars reach step outputs.
      - name: Check doc freshness
        id: freshness
        run: .github/scripts/doc-superpowers-steps/freshness-check.sh audit

      - name: Create or update issue
        if: steps.freshness.outputs.status == 'ok' && steps.freshness.outputs.count != '0'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          REPORT: ${{ steps.freshness.outputs.report }}
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync(process.env.REPORT, 'utf8'));
            const { stale, missing } = report.summary;
            const marker = '<!-- doc-superpowers:freshness-audit -->';
            const title = '[doc-superpowers] Stale documentation detected';
            const bot = 'github-actions[bot]';
            const rows = Object.entries(report.docs).map(([doc, v]) => v.status === 'missing'
              ? `- \`${doc}\` — missing (indexed, file gone)`
              : `- \`${doc}\` — ${v.reason || 'stale'} (${v.commits_behind ?? '?'} commits behind)`);
            const shown = rows.slice(0, 200);
            const body = [
              marker,
              '## Stale Documentation Report',
              '',
              `**${stale} stale, ${missing} missing doc(s)** detected:`,
              '',
              ...shown,
              ...(rows.length > shown.length ? ['', `…and ${rows.length - shown.length} more: see the job log.`] : []),
              '',
              '### How to fix',
              '1. Open Claude Code in this repo',
              '2. Run `/doc-superpowers update`',
              '3. Review and commit the changes',
              '',
              '---',
              '*Generated by [doc-superpowers](https://github.com/woodrowpearson/doc-superpowers) scheduled audit*',
              `*Last checked: ${new Date().toISOString()}*`,
            ].join('\n');

            // The bot's own open tracking issue (every page; pre-3.0 ones have no marker).
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo,
              { owner, repo, state: 'open', labels: 'doc-superpowers', per_page: 100 });
            const existing = issues.find(i => !i.pull_request && i.user && i.user.login === bot
              && ((i.body || '').includes(marker) || i.title === title));
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: ['doc-superpowers', 'documentation'] });
            }

      # Only after a check that ran and found nothing: a failed check never
      # closes the issue.
      - name: Close issue if all clear
        if: steps.freshness.outputs.status == 'ok' && steps.freshness.outputs.count == '0'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const marker = '<!-- doc-superpowers:freshness-audit -->';
            const title = '[doc-superpowers] Stale documentation detected';
            const bot = 'github-actions[bot]';
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo,
              { owner, repo, state: 'open', labels: 'doc-superpowers', per_page: 100 });
            const existing = issues.find(i => !i.pull_request && i.user && i.user.login === bot
              && ((i.body || '').includes(marker) || i.title === title));
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number,
                body: 'All documentation is now current. Closing.' });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
            }
