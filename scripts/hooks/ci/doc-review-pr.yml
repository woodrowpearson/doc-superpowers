# doc-superpowers workflow v1
# AI-powered PR documentation review with @claude interactive support
# Installed by doc-superpowers hooks installer

name: Doc Review (AI)

on:
  pull_request:
    branches: [__BASE_BRANCH__]
    types: [opened, synchronize]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'scripts/**'
      - '*.md'
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:

concurrency:
  group: doc-review-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

env:
  DOC_SUPERPOWERS_VERSION: "__VERSION__"

jobs:
  review-docs:
    if: >-
      github.event_name != 'issue_comment' ||
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Resolve Anthropic auth
        id: auth
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OAUTH" ]; then
            echo "use_oauth=true" >> "$GITHUB_OUTPUT"
            if [ -n "$API_KEY" ]; then
              echo "::notice::Both CLAUDE_CODE_OAUTH_TOKEN and ANTHROPIC_API_KEY are set; using CLAUDE_CODE_OAUTH_TOKEN."
            fi
          elif [ -n "$API_KEY" ]; then
            echo "use_oauth=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is set as a repository secret. Add one under Settings > Secrets and variables > Actions." >&2
            exit 1
          fi

      - name: Review PR documentation
        uses: anthropics/claude-code-action@1eddb334cfa79fdb21ecbe2180ca1a016e8e7d47 # v1
        with:
          claude_code_oauth_token: ${{ steps.auth.outputs.use_oauth == 'true' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          anthropic_api_key: ${{ steps.auth.outputs.use_oauth == 'false' && secrets.ANTHROPIC_API_KEY || '' }}
          trigger_phrase: "@claude"
          prompt: |
            Run /doc-superpowers review-pr to analyze the documentation impact
            of this pull request. Post findings as a PR comment with severity
            ratings (P0-P3).

            This is a read-only review — do not modify any files.
