# doc-superpowers workflow v1
# AI-powered spec compliance check on pull requests
# Installed by doc-superpowers hooks installer
#
# Runs when a same-repository PR touches an indexed spec (docs/specs/**/SPEC-*.md)
# or code one cites — judged by check-freshness from the doc index, no
# hard-coded paths. Read-only: findings go to one PR comment.

name: Spec Compliance Check (AI)

on:
  pull_request:
    branches: [__BASE_BRANCH__]
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: doc-spec-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DOC_SUPERPOWERS_VERSION: "__VERSION__"

jobs:
  spec-verify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Scope — indexed specs this PR touches
        id: scope
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
          SCOPE_DOCS: '^docs/specs/(.*/)?SPEC-[^/]*\.md$'
        run: .github/scripts/doc-superpowers-steps/freshness-check.sh scope

      - name: Resolve Anthropic auth
        id: auth
        if: steps.scope.outputs.status == 'ok' && steps.scope.outputs.affected != '0'
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: .github/scripts/doc-superpowers-steps/resolve-auth.sh

      - name: Fetch the doc-superpowers plugin (the installed version)
        id: plugin
        if: steps.scope.outputs.status == 'ok' && steps.scope.outputs.affected != '0'
        run: .github/scripts/doc-superpowers-steps/prepare-agent.sh

      - name: Verify spec compliance
        if: steps.scope.outputs.status == 'ok' && steps.scope.outputs.affected != '0'
        uses: anthropics/claude-code-action@1eddb334cfa79fdb21ecbe2180ca1a016e8e7d47 # v1.0.88
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ steps.auth.outputs.use_oauth == 'true' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          anthropic_api_key: ${{ steps.auth.outputs.use_oauth == 'false' && secrets.ANTHROPIC_API_KEY || '' }}
          plugin_marketplaces: ${{ steps.plugin.outputs.marketplace }}
          plugins: doc-superpowers@doc-superpowers
          claude_args: |
            --max-turns 40
            --allowedTools "Skill,Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(git ls-files:*),Bash(git -c core.quotePath=false diff --name-only:*),Bash(jq:*),Bash(.github/scripts/doc-tools.sh check-freshness:*),Bash(.github/scripts/doc-tools.sh status:*),Bash(.github/scripts/doc-tools.sh implementation-status:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
          prompt: |
            This is an unattended, read-only GitHub Actions run of the doc-superpowers
            plugin.
            - Use `.github/scripts/doc-tools.sh` as `$DOC_TOOLS` (this plugin
              version's vendored copy) and call it by that path: your tools allow
              exactly that command.
            - Nobody can answer questions: take the recommended option instead.
            - Do not modify any file.

            Run /doc-superpowers spec-verify --mode=review for pull request
            #${{ github.event.pull_request.number }}, against the specs in docs/specs/
            that govern its changes. Its --changed-files are the files
            `git -c core.quotePath=false diff --name-only --no-renames ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}`
            lists.
            Post the compliance findings as one PR comment:
            `gh pr comment ${{ github.event.pull_request.number }} --body "<findings>"`.
