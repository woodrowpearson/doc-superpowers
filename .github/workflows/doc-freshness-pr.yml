# doc-superpowers workflow v1
# PR documentation freshness check
# Installed by doc-superpowers hooks installer
#
# Checks the indexed docs whose code this PR changes, and the indexed docs it
# deletes. One PR comment (found again by its hidden marker) lists the stale
# and missing ones, and is updated — to "none" too — on every push. Under
# DOC_SUPERPOWERS_STRICT=1 docs out of date fail the check. A check that
# cannot run is never "0 stale": a ::warning::, or an ::error:: under STRICT.

name: Doc Freshness Check

on:
  pull_request:
    branches: [main]

concurrency:
  group: doc-freshness-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DOC_SUPERPOWERS_STRICT: "1"

jobs:
  check-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      # The result stays in $RUNNER_TEMP; only scalars reach step outputs (an
      # index-sized output or env value breaks at Linux's 128 KiB limit).
      - name: Check doc freshness
        id: freshness
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
        run: .github/scripts/doc-superpowers-steps/freshness-check.sh gate

      # Runs after a STRICT failure too, so the comment always says what the
      # check found. A fork PR's token is read-only: no comment there.
      - name: Comment on PR
        if: ${{ !cancelled() && (steps.freshness.outputs.status == 'ok' || steps.freshness.outputs.status == 'failed') && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          STATUS: ${{ steps.freshness.outputs.status }}
          REPORT: ${{ steps.freshness.outputs.report }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- doc-superpowers:freshness-report -->';
            const bot = 'github-actions[bot]';
            let count = 0;
            let lines;
            if (process.env.STATUS === 'ok') {
              const report = JSON.parse(fs.readFileSync(process.env.REPORT, 'utf8'));
              const { stale, missing } = report.summary;
              count = stale + missing;
              if (count === 0) {
                lines = ['No stale or missing docs for the code this PR changes.'];
              } else {
                const rows = Object.entries(report.docs).map(([doc, v]) => v.status === 'missing'
                  ? `| \`${doc}\` | missing (indexed, file gone) | |`
                  : `| \`${doc}\` | ${v.reason || 'stale'} | ${v.commits_behind ?? '?'} |`);
                const shown = rows.slice(0, 100);
                lines = [
                  `**${stale} stale, ${missing} missing doc(s)** for the code this PR changes:`,
                  '',
                  '| Doc | Status | Commits behind |',
                  '|-----|--------|----------------|',
                  ...shown,
                  ...(rows.length > shown.length ? ['', `…and ${rows.length - shown.length} more: see the job log.`] : []),
                  '',
                  'Run `/doc-superpowers update` to refresh these docs.',
                ];
              }
            } else {
              lines = ['The freshness check could not run, so no doc here is known to be current. See the job log.'];
            }
            const body = [marker, '## Doc Freshness Report', '', ...lines, '', '---',
              '*Generated by [doc-superpowers](https://github.com/woodrowpearson/doc-superpowers)*'].join('\n');

            // Upsert the bot's own report comment (every page; pre-3.0 ones have no marker).
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.user && c.user.login === bot
              && ((c.body || '').includes(marker) || (c.body || '').startsWith('## Doc Freshness Report')));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else if (count > 0 || process.env.STATUS !== 'ok') {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
