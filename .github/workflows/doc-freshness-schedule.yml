# doc-superpowers workflow v1
# Weekly documentation drift detector
# Installed by doc-superpowers hooks installer
#
# Checks the whole index and keeps one tracking issue: opened or updated
# while docs are stale or missing, closed once a check finds none. A check
# that cannot run fails the run and leaves the issue as it is. With
# docs/spec-claims/ present it also re-runs the spec claims (claims-check.sh
# scheduled): their findings open or update the same issue, under
# "### Spec claims", and keep it open. Without it the claims step does
# nothing and the issue is exactly as before.

name: Doc Freshness Audit (Scheduled)

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  audit-freshness:
    runs-on: ubuntu-latest
    # The freshness check alone was budgeted at 10 minutes. With spec claims,
    # `claims run --all` plus `promote --reverify --all` execute the host's
    # claim-bound tests twice over; a project without docs/spec-claims/
    # still finishes in the old time.
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      # The result stays in $RUNNER_TEMP; only scalars reach step outputs.
      - name: Check doc freshness
        id: freshness
        run: .github/scripts/doc-superpowers-steps/freshness-check.sh audit

      # Spec claims: run, re-verify every promotion, validate (status
      # disabled, and nothing run, without docs/spec-claims/). Findings never
      # fail this step: the issue reports them. It fails only when nothing
      # could run, leaving the issue as it is.
      - name: Check spec claims
        id: claims
        continue-on-error: false
        env:
          BASE_REF: origin/main
        run: .github/scripts/doc-superpowers-steps/claims-check.sh scheduled

      - name: Create or update issue
        if: >-
          (steps.freshness.outputs.status == 'ok' && steps.freshness.outputs.count != '0') ||
          steps.claims.outputs.status == 'findings'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          REPORT: ${{ steps.freshness.outputs.report }}
          CLAIMS_STATUS: ${{ steps.claims.outputs.status }}
          CLAIMS_FINDINGS: ${{ steps.claims.outputs.findings }}
          CLAIMS_REPORT: ${{ steps.claims.outputs.report }}
          JUDGE_SAMPLE: ${{ steps.claims.outputs.judge_sample }}
        with:
          script: |
            const fs = require('fs');
            // No freshness report (no doc index): the issue is for the claims.
            const report = process.env.REPORT
              ? JSON.parse(fs.readFileSync(process.env.REPORT, 'utf8'))
              : { summary: { stale: 0, missing: 0 }, docs: {} };
            const { stale, missing } = report.summary;
            const marker = '<!-- doc-superpowers:freshness-audit -->';
            const title = '[doc-superpowers] Stale documentation detected';
            const bot = 'github-actions[bot]';
            const rows = Object.entries(report.docs).map(([doc, v]) => v.status === 'missing'
              ? `- \`${doc}\` — missing (indexed, file gone)`
              : `- \`${doc}\` — ${v.reason || 'stale'} (${v.commits_behind ?? '?'} commits behind)`);
            const shown = rows.slice(0, 200);
            // The claims section only when the claims found something or could
            // not all run: with them disabled or ok, the body is as it was.
            const claimsStatus = process.env.CLAIMS_STATUS || 'disabled';
            const claims = [];
            if (claimsStatus === 'findings' || claimsStatus === 'indeterminate') {
              const verdicts = process.env.CLAIMS_REPORT
                ? JSON.parse(fs.readFileSync(process.env.CLAIMS_REPORT, 'utf8')) : [];
              // Each (claim, check, message) once: run and promote --reverify
              // can report the same red claim (the step counts it once too).
              const seen = new Set();
              const found = verdicts.flatMap(v => (v.findings || []).map(f => ({ v, f })))
                .filter(({ f }) => { const k = JSON.stringify([f.claim, f.check, f.message]); return !seen.has(k) && seen.add(k); })
                .map(({ v, f }) => `- \`${f.claim || f.doc || '?'}\` — ${f.message} (${v.verb}${f.check && f.check !== v.verb ? ' ' + f.check : ''})`);
              const listed = found.slice(0, 200);
              const sample = (process.env.JUDGE_SAMPLE || '').split(',').filter(Boolean);
              claims.push('### Spec claims', '',
                `**${process.env.CLAIMS_FINDINGS || '0'} finding(s)**${claimsStatus === 'indeterminate' ? ' (some claims could not be checked: see the job log)' : ''}`,
                '', ...listed,
                ...(found.length > listed.length ? ['', `…and ${found.length - listed.length} more: see the job log.`] : []),
                ...(sample.length ? ['', `Judge claims to review this week: ${sample.map(id => `\`${id}\``).join(', ')}`] : []),
                '');
            }
            const body = [
              marker,
              '## Stale Documentation Report',
              '',
              `**${stale} stale, ${missing} missing doc(s)** detected:`,
              '',
              ...shown,
              ...(rows.length > shown.length ? ['', `…and ${rows.length - shown.length} more: see the job log.`] : []),
              '',
              '### How to fix',
              '1. Open Claude Code in this repo',
              '2. Run `/doc-superpowers update`',
              '3. Review and commit the changes',
              '',
              ...claims,
              '---',
              '*Generated by doc-superpowers scheduled audit*',
              `*Last checked: ${new Date().toISOString()}*`,
            ].join('\n');

            // The bot's own open tracking issue (every page; pre-3.0 ones have no marker).
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo,
              { owner, repo, state: 'open', labels: 'doc-superpowers', per_page: 100 });
            const existing = issues.find(i => !i.pull_request && i.user && i.user.login === bot
              && ((i.body || '').includes(marker) || i.title === title));
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: ['doc-superpowers', 'documentation'] });
            }

      # Only after a check that ran and found nothing: a failed check never
      # closes the issue, nor do spec claims with findings or that could not
      # all run. Without a doc index, only claims that ran clean close it (an
      # issue the claims opened); a project with neither never touches it.
      - name: Close issue if all clear
        if: >-
          (steps.freshness.outputs.status == 'ok' && steps.freshness.outputs.count == '0' &&
          (steps.claims.outputs.status == 'disabled' || steps.claims.outputs.status == 'ok')) ||
          (steps.freshness.outputs.status == 'no-index' && steps.claims.outputs.status == 'ok')
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const marker = '<!-- doc-superpowers:freshness-audit -->';
            const title = '[doc-superpowers] Stale documentation detected';
            const bot = 'github-actions[bot]';
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo,
              { owner, repo, state: 'open', labels: 'doc-superpowers', per_page: 100 });
            const existing = issues.find(i => !i.pull_request && i.user && i.user.login === bot
              && ((i.body || '').includes(marker) || i.title === title));
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number,
                body: 'All documentation is now current. Closing.' });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
            }
