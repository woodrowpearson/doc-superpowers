# Shell test suites — the seven suites that gate changes to this repo — the
# doc-search pytest suite (search/, a uv Python package), and the check that
# this repo's own self-installed CI tier is what the installer would write
# today.
#
# Every step runs scripts/check-ci.sh, which runs the same checks locally
# (`bash scripts/check-ci.sh`: both interpreters, every check; --fast for the
# quick part). Add a check there, then a step here naming it.
#
# This workflow is for THIS repository only. It is deliberately not part of the
# downstream CI template set in scripts/hooks/ci/ (which the hooks installer
# copies into consuming projects) — those projects do not have these suites.
# (So it carries no "doc-superpowers workflow" marker: the installer does not
# own it.)

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A full matrix run takes a few minutes; superseded pushes to the same ref are
# not worth the runner time. Never cancel on main — those runs are the record
# of what landed.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  suites:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report both interpreters independently — a bash-3.2-only failure is the
      # signal this matrix exists to surface, and fail-fast would hide it behind
      # an unrelated Linux failure.
      fail-fast: false
      matrix:
        include:
          # The interpreter downstream CI runs doc-tools.sh under.
          - name: ubuntu / bash 5.x
            os: ubuntu-latest
            bash: bash
            bash_major: "5"
          # macOS's system bash — 3.2.57, frozen at the last GPLv2 release, and
          # the interpreter this repo's own contributors run locally.
          #
          # The suites are `#!/usr/bin/env bash`, and GitHub's macOS image puts
          # Homebrew's bash 5.x ahead of /bin/bash on PATH — so running them by
          # shebang here would silently test bash 5 a second time and cover 3.2
          # nowhere. The interpreter is therefore passed explicitly.
          - name: macos / bash 3.2
            os: macos-latest
            bash: /bin/bash
            bash_major: "3"

    env:
      BASH_BIN: ${{ matrix.bash }}
      BASH_MAJOR: ${{ matrix.bash_major }}
      # Every check below is scripts/check-ci.sh, the one command a contributor
      # runs locally (#27): this workflow carries no check body of its own, so
      # the two cannot drift apart. check-ci.sh sets the three flags below to 1
      # itself; they are repeated here so a step that ever runs a suite
      # directly still fails closed.
      # test-doc-pr-release.sh reports a missing YAML parser as a loud SKIP so a
      # contributor without one can still run it locally. In CI that SKIP must
      # never pass silently: this flag turns it into a counted FAIL.
      DOC_SP_REQUIRE_YAML_PARSER: "1"
      # test-spec-status-model.sh runs the OpenCode plugin under node (a
      # test-time tool only; the plugin is shipped JS). Without node that case
      # is a loud SKIP locally; here this flag makes it a counted FAIL.
      DOC_SP_REQUIRE_NODE: "1"
      # test-doc-tools.sh gates the shipped scripts on shellcheck (warning
      # severity). Without shellcheck that is a loud SKIP locally; here a FAIL.
      DOC_SP_REQUIRE_SHELLCHECK: "1"
      # The doc-search pytest suite runs through uv (search/uv.lock, --frozen).
      # Without uv the search check is a loud SKIP locally; here a FAIL.
      DOC_SP_REQUIRE_UV: "1"

    steps:
      # No suite reads this repo's history — they each build throwaway git
      # fixtures in tempdirs — but a full clone is ~4 MB here and matches the
      # sibling workflows, so it is not worth trading for a shallow-clone edge case.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      # ubuntu-latest ships shellcheck; the macOS image may not.
      - name: Install shellcheck
        run: |
          command -v shellcheck >/dev/null 2>&1 || brew install shellcheck

      # uv for the doc-search pytest suite (the search check). It installs the
      # Python that search/.python-version names and the locked dependencies
      # itself; the suite never touches the network once they are in.
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # Fail loudly here rather than midway through a suite if an image change
      # ever drops one of these: jq and git (the hard dependencies), a YAML
      # parser (PyYAML on ubuntu; ruby's psych on macOS, which has no PyYAML),
      # node and shellcheck. The DOC_SP_REQUIRE_* flags are the second lock
      # inside the suites themselves.
      - name: Verify toolchain
        run: |
          "$BASH_BIN" scripts/check-ci.sh --bash "$BASH_BIN" --verbose toolchain

      # Guard the premise of the matrix: if a future runner image changes what
      # /bin/bash is, this leg would stop covering 3.2 while still reporting
      # green. Assert the major version instead of discovering that silently.
      - name: Assert bash major version
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016  # intentional: BASH_VERSINFO must expand in
          # the inner bash under test, not in this shell
          actual=$("$BASH_BIN" -c 'echo "${BASH_VERSINFO[0]}"')
          echo "$BASH_BIN major version: $actual (expected $BASH_MAJOR)"
          if [ "$actual" != "$BASH_MAJOR" ]; then
            echo "::error::$BASH_BIN is bash $actual, expected $BASH_MAJOR — this leg is no longer testing the interpreter it claims to."
            exit 1
          fi

      # Run each suite as its own step so a failure names the suite directly.
      - name: test-doc-tools.sh
        run: |
          "$BASH_BIN" scripts/check-ci.sh --bash "$BASH_BIN" --verbose doc-tools

      - name: test-hooks.sh
        run: |
          "$BASH_BIN" scripts/check-ci.sh --bash "$BASH_BIN" --verbose hooks

      - name: test-spec-status-model.sh
        run: |
          "$BASH_BIN" scripts/check-ci.sh --bash "$BASH_BIN" --verbose spec-status-model

      - name: test-doc-pr-release.sh
        run: |
          "$BASH_BIN" scripts/check-ci.sh --bash "$BASH_BIN" --verbose doc-pr-release

      - name: test-merge-driver.sh
        run: |
          "$BASH_BIN" scripts/check-ci.sh --bash "$BASH_BIN" --verbose merge-driver

      - name: test-spec-claims.sh
        run: |
          "$BASH_BIN" scripts/check-ci.sh --bash "$BASH_BIN" --verbose spec-claims

      - name: test-ledger.sh
        run: |
          "$BASH_BIN" scripts/check-ci.sh --bash "$BASH_BIN" --verbose ledger

      # The doc-search pytest suite (search/, the opt-in MCP server), run once
      # per leg. check-ci.sh runs `uv run --project search --frozen
      # --all-extras pytest -q` for it; it does not depend on the bash under test.
      - name: doc-search pytest suite
        run: |
          "$BASH_BIN" scripts/check-ci.sh --bash "$BASH_BIN" --verbose search

      # This repository installs its own CI tier (scripts/hooks/install.sh
      # install --ci): every self-installed file must be exactly what the
      # installer writes today, and .gitattributes must route the index to the
      # merge driver (scripts/check-self-install.sh says why and how). After
      # changing a template, doc-tools.sh or a CI helper script, run
      # `bash scripts/hooks/install.sh install --ci` and commit the result.
      # It runs even when a suite failed: a suite failure must not hide drift.
      # Not on a cancelled run (cancel-in-progress): its workspace may be half
      # set up, and the step would report spurious drift.
      - name: Self-installed CI tier matches its templates
        if: ${{ !cancelled() }}
        run: |
          "$BASH_BIN" scripts/check-ci.sh --bash "$BASH_BIN" --verbose self-install

      # Version strings drift silently otherwise: bump-version writes five
      # manifests and RELEASE-NOTES.md is the canonical source check-version
      # reads, so a hand-edited or half-applied bump only shows up here.
      - name: check-version
        run: |
          "$BASH_BIN" scripts/check-ci.sh --bash "$BASH_BIN" --verbose check-version

      # The version main ships must have its v<version> tag on origin (#28):
      # the AI workflow templates clone the plugin at that tag
      # (prepare-agent.sh), so a release whose tag was never pushed breaks
      # every consumer's AI workflows. On pushes to main only — a pull request
      # carrying a release is tagged before it merges (references/release.md,
      # step 12) — and not on a cancelled run.
      - name: Release tag is on origin
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          "$BASH_BIN" scripts/check-ci.sh --bash "$BASH_BIN" --verbose tag
