# Shell test suites — the five suites that gate changes to this repo — and the
# check that this repo's own self-installed CI tier is what the installer
# would write today.
#
# This workflow is for THIS repository only. It is deliberately not part of the
# downstream CI template set in scripts/hooks/ci/ (which the hooks installer
# copies into consuming projects) — those projects do not have these suites.
# (So it carries no "doc-superpowers workflow" marker: the installer does not
# own it.)

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A full matrix run takes a few minutes; superseded pushes to the same ref are
# not worth the runner time. Never cancel on main — those runs are the record
# of what landed.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  suites:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report both interpreters independently — a bash-3.2-only failure is the
      # signal this matrix exists to surface, and fail-fast would hide it behind
      # an unrelated Linux failure.
      fail-fast: false
      matrix:
        include:
          # The interpreter downstream CI runs doc-tools.sh under.
          - name: ubuntu / bash 5.x
            os: ubuntu-latest
            bash: bash
            bash_major: "5"
          # macOS's system bash — 3.2.57, frozen at the last GPLv2 release, and
          # the interpreter this repo's own contributors run locally.
          #
          # The suites are `#!/usr/bin/env bash`, and GitHub's macOS image puts
          # Homebrew's bash 5.x ahead of /bin/bash on PATH — so running them by
          # shebang here would silently test bash 5 a second time and cover 3.2
          # nowhere. The interpreter is therefore passed explicitly.
          - name: macos / bash 3.2
            os: macos-latest
            bash: /bin/bash
            bash_major: "3"

    env:
      BASH_BIN: ${{ matrix.bash }}
      BASH_MAJOR: ${{ matrix.bash_major }}
      # test-doc-pr-release.sh reports a missing YAML parser as a loud SKIP so a
      # contributor without one can still run it locally. In CI that SKIP must
      # never pass silently: this flag turns it into a counted FAIL.
      DOC_SP_REQUIRE_YAML_PARSER: "1"
      # test-spec-status-model.sh runs the OpenCode plugin under node (a
      # test-time tool only; the plugin is shipped JS). Without node that case
      # is a loud SKIP locally; here this flag makes it a counted FAIL.
      DOC_SP_REQUIRE_NODE: "1"

    steps:
      # No suite reads this repo's history — they each build throwaway git
      # fixtures in tempdirs — but a full clone is ~4 MB here and matches the
      # sibling workflows, so it is not worth trading for a shallow-clone edge case.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      # Fail loudly here rather than midway through a suite if an image change
      # ever drops one of these. `jq` is the hard dependency; doc-tools.sh
      # already falls back from sha256sum to shasum on its own.
      - name: Verify toolchain
        run: |
          set -euo pipefail
          for tool in jq git; do
            command -v "$tool" >/dev/null 2>&1 || { echo "::error::$tool not found"; exit 1; }
          done
          # test-doc-pr-release.sh parses the eight CI templates to prove the
          # placeholder substitution leaves valid YAML, and reads template
          # structure (concurrency, job guards, run: wiring) through the same
          # parser. PyYAML ships on the ubuntu image but not the macOS one, so
          # ruby's stdlib psych is the accepted fallback. Fail here, up front;
          # DOC_SP_REQUIRE_YAML_PARSER (job env) is the second lock inside the
          # suite itself.
          if python3 -c 'import yaml' >/dev/null 2>&1; then
            yaml_parser="python3 + PyYAML"
          elif command -v ruby >/dev/null 2>&1 && ruby -ryaml -e 'exit 0' >/dev/null 2>&1; then
            yaml_parser="ruby (psych)"
          else
            echo "::error::no YAML parser (need python3 with PyYAML, or ruby) — the workflow-template YAML assertions would not run"
            exit 1
          fi
          # test-spec-status-model.sh drives .opencode/plugins/doc-superpowers.js
          # under node; both runner images ship Node.js. DOC_SP_REQUIRE_NODE
          # (job env) is the second lock inside the suite.
          command -v node >/dev/null 2>&1 || { echo "::error::node not found — the OpenCode plugin simulation would not run"; exit 1; }
          echo "jq:   $(jq --version)"
          echo "yaml: $yaml_parser"
          echo "node: $(node --version)"
          "$BASH_BIN" --version | head -1

      # Guard the premise of the matrix: if a future runner image changes what
      # /bin/bash is, this leg would stop covering 3.2 while still reporting
      # green. Assert the major version instead of discovering that silently.
      - name: Assert bash major version
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016  # intentional: BASH_VERSINFO must expand in
          # the inner bash under test, not in this shell
          actual=$("$BASH_BIN" -c 'echo "${BASH_VERSINFO[0]}"')
          echo "$BASH_BIN major version: $actual (expected $BASH_MAJOR)"
          if [ "$actual" != "$BASH_MAJOR" ]; then
            echo "::error::$BASH_BIN is bash $actual, expected $BASH_MAJOR — this leg is no longer testing the interpreter it claims to."
            exit 1
          fi

      # Run each suite as its own step so a failure names the suite directly.
      - name: test-doc-tools.sh
        run: |
          "$BASH_BIN" scripts/test-doc-tools.sh

      - name: test-hooks.sh
        run: |
          "$BASH_BIN" scripts/test-hooks.sh

      - name: test-spec-status-model.sh
        run: |
          "$BASH_BIN" scripts/test-spec-status-model.sh

      - name: test-doc-pr-release.sh
        run: |
          "$BASH_BIN" scripts/test-doc-pr-release.sh

      - name: test-merge-driver.sh
        run: |
          "$BASH_BIN" scripts/test-merge-driver.sh

      # This repository installs its own CI tier (scripts/hooks/install.sh
      # install --ci), and nothing else notices those copies going stale: for
      # months its freshness workflows called a .github/scripts/doc-tools.sh
      # that was never committed. So every self-installed file must be exactly
      # what the installer writes today: each workflow that
      # .claude/doc-superpowers/installed.json records as installed, rendered
      # from its template with the recorded choices (install.sh's
      # render_workflow substitutions), and byte copies of doc-tools.sh and of
      # the helpers — with every script a workflow runs present and executable.
      # After changing a template, doc-tools.sh or a CI helper script, run
      # `bash scripts/hooks/install.sh install --ci` and commit the result.
      # It runs even when a suite failed: a suite failure must not hide drift.
      - name: Self-installed CI tier matches its templates
        if: always()
        run: |
          set -euo pipefail
          state=.claude/doc-superpowers/installed.json
          fail=0 git_fail=0
          drift() { echo "::error file=$1::$2"; fail=1; }
          esc() { printf '%s' "$1" | sed -e 's/[\\|&]/\\&/g'; }
          [ -f "$state" ] || { echo "::error::$state is missing"; exit 1; }
          base=$(esc "$(jq -r '.tiers.ci.base_branch' "$state")")
          cron=$(esc "$(jq -r '.tiers.ci.cron' "$state")")
          strict=$(jq -r 'if .tiers.ci.ci_strict == true then 1 else 0 end' "$state")
          installed=$(jq -r '.tiers.ci.workflows // {} | to_entries[] | select(.value.state == "installed") | .key' "$state")
          [ -n "$installed" ] || drift "$state" "records no installed workflow"
          version=""
          for t in scripts/hooks/ci/*.yml; do
            w=$(basename "$t" .yml)
            f=.github/workflows/$w.yml
            if ! printf '%s\n' "$installed" | grep -qxF "$w"; then
              [ ! -e "$f" ] || drift "$f" "exists but $state does not record $w as installed"
              continue
            fi
            if [ -z "$version" ] && grep -q '__VERSION__' "$t"; then
              version=$(esc "v$("$BASH_BIN" scripts/doc-tools.sh tools version)")
            fi
            sed -e "s|__BASE_BRANCH__|$base|g" -e "s|__VERSION__|$version|g" \
              -e "s|__CRON_SCHEDULE__|$cron|g" -e "s|__CI_STRICT__|$strict|g" \
              "$t" > "$RUNNER_TEMP/$w.rendered.yml"
            diff -u "$RUNNER_TEMP/$w.rendered.yml" "$f" \
              || drift "$f" "differs from $t rendered with the choices in $state"
            for p in $(grep -oE '\.github/scripts/[A-Za-z0-9._/-]+\.sh' "$f" | sort -u || true); do
              [ -x "$p" ] || drift "$f" "runs $p, which is not vendored (or not executable)"
            done
          done
          # A doc-superpowers workflow with no template (a retired one, such as
          # doc-index-update) is drift too, on disk or recorded in the state.
          for f in .github/workflows/*.yml; do
            [ -f "$f" ] || continue
            w=$(basename "$f" .yml)
            [ ! -f "scripts/hooks/ci/$w.yml" ] || continue
            # (awk, not head | grep -q: pipefail would read a SIGPIPE as no match)
            ! awk 'NR <= 5 && /doc-superpowers workflow v[0-9]/ { m = 1 } END { exit !m }' "$f" \
              || drift "$f" "is a doc-superpowers workflow with no template (retired): install --ci removes it"
          done
          for w in $installed; do
            [ -f "scripts/hooks/ci/$w.yml" ] || drift "$state" "records $w as installed, but it has no template (retired)"
          done
          cmp scripts/doc-tools.sh .github/scripts/doc-tools.sh \
            || drift .github/scripts/doc-tools.sh "differs from scripts/doc-tools.sh"
          [ -x .github/scripts/doc-tools.sh ] || drift .github/scripts/doc-tools.sh "is not executable"
          for d in .github/scripts/*/; do
            [ -d "$d" ] || continue
            d=$(basename "$d")
            for f in ".github/scripts/$d"/*; do
              p="scripts/hooks/ci/$d/$(basename "$f")"
              if [ ! -f "$p" ]; then
                drift "$f" "is not a plugin helper (no $p)"
                continue
              fi
              cmp "$p" "$f" || drift "$f" "differs from $p"
              [ -x "$f" ] || drift "$f" "is not executable"
            done
            for p in "scripts/hooks/ci/$d"/*.sh; do
              [ -e ".github/scripts/$d/$(basename "$p")" ] \
                || drift ".github/scripts/$d" "lacks $(basename "$p") (a partial helper install)"
            done
          done
          # The git tier's one committed piece: the index merge-driver attribute.
          if [ "$(git check-attr merge -- docs/.doc-index.json)" != "docs/.doc-index.json: merge: doc-index" ]; then
            echo "::error file=.gitattributes::does not route docs/.doc-index.json to the doc-index merge driver"
            git_fail=1
          fi
          [ "$fail" = 0 ] \
            || echo "::error::the self-installed CI tier drifted: run bash scripts/hooks/install.sh install --ci and commit the result"
          [ "$git_fail" = 0 ] \
            || echo "::error::the .gitattributes merge-driver block is missing: run bash scripts/hooks/install.sh install --git and commit .gitattributes"
          [ "$fail" = 0 ] && [ "$git_fail" = 0 ] || exit 1
          echo "Self-installed CI tier matches its templates:" $installed

      # Version strings drift silently otherwise: bump-version writes five
      # manifests and RELEASE-NOTES.md is the canonical source check-version
      # reads, so a hand-edited or half-applied bump only shows up here.
      - name: check-version
        run: |
          "$BASH_BIN" scripts/doc-tools.sh check-version
