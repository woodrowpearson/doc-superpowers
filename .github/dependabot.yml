# Security and version updates for doc-search's Python lock (search/uv.lock)
# and the diagram renderer's npm lock (scripts/diagram/package-lock.json).
# Everything else this repository runs is a shell script or a pinned action.
version: 2
updates:
  - package-ecosystem: uv
    directory: /search
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
  # The renderer pins exact versions (doc-tools.sh diagram; the design is
  # docs/superpowers/specs/2026-11-17-local-diagram-rendering-design.md): a
  # bump changes what every diagram looks like, so redraw them in the same PR.
  - package-ecosystem: npm
    directory: /scripts/diagram
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
