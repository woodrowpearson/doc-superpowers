[project]
name = "doc-search"
version = "0.1.0"
description = "Opt-in MCP server for doc-superpowers: semble-backed search over a repository's docs and code, with doc-aware metadata."
requires-python = ">=3.11"
dependencies = [
    "semble>=0.7,<0.8",
    "mcp>=2.3,<3",
    "pathspec",
    # mcp 2.3 imports cryptography in mcp.server.request_state but declares it only through
    # pyjwt[crypto], which tool.uv excludes below
    "cryptography",
]

[project.optional-dependencies]
cloud = [
    "google-genai",
    "google-cloud-firestore",
]
local-transformer = [
    "onnxruntime>=1.23.2,<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "onnxruntime>=1.24; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "flatbuffers",
    "protobuf",
    # imported by transformer.py; semble already installs both, so they add no package
    "tokenizers",
    "huggingface-hub",
]

[project.scripts]
doc-search = "doc_search.cli:main"

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
# Hard dependencies of a parent that no doc-search code path imports (checked per profile against a
# real serve/index run): semble's interactive installer (questionary, and prompt-toolkit and wcwidth
# with it), mcp's OAuth client (pyjwt), and onnxruntime 1.23's model tools (sympy and mpmath,
# coloredlogs and humanfriendly; Intel macOS only, 1.24+ no longer requires them).
# uv older than 0.9.10 warns that it does not know this key; `--frozen` installs the lock either way.
exclude-dependencies = ["questionary", "pyjwt", "sympy", "coloredlogs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: spawns the real console script in a subprocess (still part of the default run)",
    "live: touches the network (semble's default model, and the gte-modernbert-base ONNX model and tokenizer, from Hugging Face); skipped unless DOC_SEARCH_LIVE=1",
]
