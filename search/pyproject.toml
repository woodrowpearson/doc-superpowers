[project]
name = "doc-search"
version = "0.1.0"
description = "Opt-in MCP server for doc-superpowers: semble-backed search over a repository's docs and code, with doc-aware metadata."
requires-python = ">=3.11"
dependencies = [
    "semble>=0.7,<0.8",
    "mcp>=2.3,<3",
    "pathspec",
]

[project.optional-dependencies]
cloud = [
    "google-genai",
    "google-cloud-firestore",
]

[project.scripts]
doc-search = "doc_search.cli:main"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: spawns the real console script in a subprocess (still part of the default run)",
]
